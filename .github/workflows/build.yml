name: Build FIT3D APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Update Gradle Wrapper and Build APK
        run: |
          unzip fit3d.zip -d my_app
          cd my_app
          # Upgrade gradle wrapper to version 7.5 for Java 11 compatibility
          ./gradlew wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_app/app/build/outputs/apk/debug/app-debug.apk
